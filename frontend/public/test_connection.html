<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Connection Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .status { padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Backend Connection Test</h1>
    <p>Click the button below to test the connection to your Django API.</p>
    <button onclick="testConnection()">Test Connection</button>
    <div id="results" style="margin-top: 20px;"></div>

    <script>
        async function testConnection() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = 'Testing...';
            
            try {
                // We expect 405 Method Not Allowed because we are sending a GET to a POST-only endpoint
                // But receiving 405 PROVES the server is reachable.
                const response = await fetch('http://127.0.0.1:8000/api/users/login/', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.status === 405) {
                    resultsDiv.innerHTML = '<div class="status success">✅ SUCCESS: Backend is REACHABLE! (Status 405 received as expected)</div>';
                } else if (response.ok) {
                     resultsDiv.innerHTML = '<div class="status success">✅ SUCCESS: Backend is REACHABLE! (Status ' + response.status + ')</div>';
                } else {
                    resultsDiv.innerHTML = '<div class="status error">⚠️ WARNING: Reachable but returned status ' + response.status + '</div>';
                }
            } catch (error) {
                console.error(error);
                resultsDiv.innerHTML = '<div class="status error">❌ ERROR: ' + error.message + '<br>Make sure the backend is running at http://127.0.0.1:8000</div>';
            }
        }
    </script>
</body>
</html>
